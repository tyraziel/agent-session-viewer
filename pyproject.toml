[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-session-viewer"
version = "0.1.0"
description = "Web UI for browsing AI coding agent sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Andrew Potozniak" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "nicegui>=2.0",
]

[project.urls]
Homepage = "https://github.com/tyraziel/agent-session-viewer"
Repository = "https://github.com/tyraziel/agent-session-viewer"

[project.scripts]
agent-session-viewer = "agent_session_viewer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_session_viewer"]
